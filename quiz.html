<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Identity · Coach Mew Mastermind</title>
<meta name="description" content="ทุกคนมีแสงในแบบของตัวเอง แล้วคุณล่ะ มีพลังของดวงดาวแบบไหน? 16 คำถาม ประมาณ 4–6 นาที ผลฟรีทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="Coach Mew Mastermind หน้าแรก">
      <span class="logo-mark" data-icon="logo"></span>
      <span class="logo-txt"><b>Coach Mew</b><small>MASTERMIND</small></span>
    </a>
    <ul class="menu" id="menu">
      <li><a href="index.html">หน้าแรก</a></li>
      <li><a href="index.html#coach">รู้จักโค้ชมิว</a></li>
      <li><a href="quiz.html" aria-current="page">ค้นหาดาวของคุณ</a></li>
      <li><a href="index.html#coaching">Coaching</a></li>
      <li><a href="index.html#course">คอร์สออนไลน์</a></li>
    </ul>
    <button class="burger" id="burger" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="menu">☰</button>
  </div>
</header>

<main class="quiz-page s-navy stars">
  <div class="wrap" id="app" aria-live="polite">
    <div class="panel center-panel c-deep"><p>กำลังโหลดแบบประเมิน...</p></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span class="slogan">เพื่อนร่วมทางในการสร้างตัวตน</span>
    <span>© 2026 Coach Mew Mastermind</span>
  </div>
</footer>

<script src="cosmic.js"></script>
<script>
(async function(){
  const {esc, ICONS, store, track} = Cosmic;
  const app = document.getElementById('app');
  const KEY = 'cosmic-quiz';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let data;
  try{ data = await Cosmic.loadData(); }
  catch(err){
    console.error(err);
    app.innerHTML = '<div class="panel center-panel c-deep"><p>โหลดแบบประเมินไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</p></div>';
    return;
  }

  const Q = data.questions, N = Q.length;                      // 16 in the current JSON
  const qIndex = Object.fromEntries(Q.map((q,i)=>[q.id,i]));
  const pad = n => String(n).padStart(2,'0');
  // Button / screen text from JSON → assessment_ui (fallbacks only if a key is missing)
  const UI = Object.assign({
    welcome:'', instruction:'เลือกเพียง 1 คำตอบที่ใกล้เคียงสิ่งที่คุณมักทำจริงที่สุด ไม่มีถูกหรือผิด',
    start:'เริ่มทำแบบประเมิน', next:'ข้อถัดไป', back:'ย้อนกลับ',
    completion:`คุณตอบครบทั้ง ${N} ข้อแล้ว`, reveal:'เปิดเผย Cosmic Identity ของฉัน', estimated_minutes:''
  }, data.assessment_ui || {});
  const minutes = String(UI.estimated_minutes).split(' ')[0];   // "4–6 (estimate; …)" → "4–6"

  // Screen order: welcome (Brand Story + welcome) → [chapter intro → its questions] × chapters → complete → result
  const SCREENS = [{k:'welcome'}];
  data.chapters.forEach((ch,ci)=>{
    SCREENS.push({k:'chapter', ci});
    ch.question_ids.forEach(id=>SCREENS.push({k:'q', i:qIndex[id], ci}));
  });
  SCREENS.push({k:'complete'}, {k:'result'});
  const screenOfQ = i => SCREENS.findIndex(s=>s.k==='q' && s.i===i);

  // State (kept in sessionStorage so a refresh continues where you were)
  const fresh = () => ({pos:0, answers:Array(N).fill(null), saved:false, tab:null});
  let S = Object.assign(fresh(), store.get(KEY) || {});
  if(!Array.isArray(S.answers) || S.answers.length !== N) S = fresh();
  // never sit past the first unanswered question
  const firstGap = S.answers.findIndex(a=>!a);
  if(firstGap !== -1 && S.pos > screenOfQ(firstGap)) S.pos = screenOfQ(firstGap);
  const save = () => store.set(KEY, S);
  const go = pos => { S.pos = pos; save(); render(); };

  function render(){
    const s = SCREENS[S.pos];
    if(s.k === 'welcome') renderWelcome();
    else if(s.k === 'chapter') renderChapter(s.ci);
    else if(s.k === 'q') renderQuestion(s.i, s.ci);
    else if(s.k === 'complete') renderComplete();
    else renderResult();
    Cosmic.screenIn(app);                               // soft fade-up for every new screen
    Cosmic.reveal(app);                                 // story paragraphs / result cards rise in on scroll
    window.scrollTo({top:0, behavior:'auto'});
    const h = app.querySelector('h1,h2');
    if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  }

  // ----- Brand Story (JSON → brand_story, shown in full before the welcome) -----
  function storyHTML(){
    const b = data.brand_story;
    if(!b) return '';
    return `
      <section class="story" aria-labelledby="storyH">
        <span class="story-label">${esc(b.section_label)}</span>
        <h1 class="story-h" id="storyH">${esc(b.headline)}</h1>
        <div class="story-cols">${b.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
        <p class="story-close">${esc(b.closing_quote)}</p>
      </section>`;
  }

  // ----- Welcome -----
  function renderWelcome(){
    track('welcome', {}, true);
    const H = data.brand_story ? 'h2' : 'h1';
    app.innerHTML = storyHTML() + `
      <div class="panel center-panel c-deep">
        <span class="ico ico-lg">${ICONS.logo}</span>
        <span class="eyebrow">Cosmic Identity</span>
        <${H} style="font-size:clamp(24px,6vw,34px)">ทุกคนมีแสงในแบบของตัวเอง<br>แล้วคุณล่ะ มีพลังของดวงดาวแบบไหน?</${H}>
        ${UI.welcome ? `<p class="lead">${esc(UI.welcome)}</p>` : ''}
        <div class="pill-row"><span>${N} คำถาม</span>${minutes ? `<span>ประมาณ ${esc(minutes)} นาที</span>` : ''}<span>ไม่มีถูกหรือผิด</span></div>
        <ul class="tips">
          <li>${esc(UI.instruction)}</li>
          <li>แก้คำตอบได้ก่อนส่ง</li>
          <li>เป็นแบบประเมินเพื่อสำรวจตนเอง (Self-Reflection) ไม่ใช่การวินิจฉัย</li>
        </ul>
        <button type="button" class="btn btn-gold btn-block" id="start">${esc(UI.start)}</button>
      </div>`;
    document.getElementById('start').onclick = ()=>{ track('start'); go(1); };
  }

  // ----- Chapter intro -----
  function renderChapter(ci){
    const ch = data.chapters[ci];
    app.innerHTML = `
      <div class="chapter-wrap c-lgold">
        <span class="chapter-no">CHAPTER ${ch.id}</span>
        <h1 class="chapter-name">${esc(ch.name)}</h1>
        <p class="chapter-th">${esc(ch.title_th)}</p>
        <p class="intro">${esc(ch.intro)}</p>
        <button type="button" class="btn btn-dark" id="next">${esc(UI.next)}</button>
        <button type="button" class="link-btn" id="back">${esc(UI.back)}</button>
      </div>`;
    document.getElementById('next').onclick = ()=>go(S.pos+1);
    document.getElementById('back').onclick = ()=>go(S.pos-1);
  }

  // ----- Question (1 per screen; type names never shown here) -----
  function renderQuestion(i, ci){
    const q = Q[i], ch = data.chapters[ci], picked = S.answers[i];
    app.innerHTML = `
      <div class="panel c-deep">
        <div class="q-head">
          <div class="q-meta"><b>CHAPTER ${ch.id} · ${esc(ch.name)}</b><span>ข้อ ${pad(i+1)}/${N}</span></div>
          <div class="bar" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${i+1}"><i style="width:${(i+1)/N*100}%"></i></div>
        </div>
        <p class="q-title">${esc(q.title)}</p>
        <h2 class="q-prompt" id="qp">${esc(q.prompt)}</h2>
        <div class="opts" role="group" aria-labelledby="qp">
          ${q.answers.map(a=>`
            <button type="button" class="opt" data-opt="${esc(a.option)}" aria-pressed="${picked===a.option}">
              <span class="letter">${esc(a.option)}</span>
              <span class="txt">${esc(a.text)}</span>
            </button>`).join('')}
        </div>
        <div class="q-nav">
          <button type="button" class="btn btn-line btn-back" id="back">← ${esc(UI.back)}</button>
        </div>
      </div>`;
    // Tap an answer = go straight to the next screen (no confirm button). Back keeps the answer so it can be changed.
    let moving = false;
    app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ()=>{
      if(moving) return;
      moving = true;
      app.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed', x === b));
      if(S.answers[i] !== b.dataset.opt) S.saved = false;
      S.answers[i] = b.dataset.opt; save();
      track('answer', {question_no:i+1, option:S.answers[i]});
      setTimeout(()=>go(S.pos+1), 320);   // short pause so the choice is seen lighting up
    }));
    document.getElementById('back').onclick = ()=>{ if(!moving) go(S.pos-1); };
  }

  // ----- Completed -----
  function renderComplete(){
    track('complete', {}, true);
    app.innerHTML = `
      <div class="panel center-panel c-lgold">
        <span class="ico ico-lg">${ICONS.logo}</span>
        <h1 class="done-title">COSMIC MISSION COMPLETED!</h1>
        <p class="lead">${esc(UI.completion)} ✨</p>
        <button type="button" class="btn btn-dark btn-block" id="reveal">${esc(UI.reveal)}</button>
        <button type="button" class="link-btn" id="back">${esc(UI.back)}</button>
      </div>`;
    document.getElementById('reveal').onclick = ()=>{
      const r = Cosmic.score(data, S.answers);
      if(!S.saved){ Cosmic.saveResult(S.answers, r); S.saved = true; }
      track('reveal', {}, true);
      S.tab = r.leading[0];
      go(S.pos+1);
    };
    document.getElementById('back').onclick = ()=>go(S.pos-1);
  }

  // ----- Result -----
  const TIE_TEXT = 'คุณมีพลังมากกว่าหนึ่งดวงดาวที่โดดเด่นพอ ๆ กัน นี่อาจสะท้อนว่าคุณใช้วิธีสื่อสารต่างกันตามสถานการณ์ ลองสำรวจทั้งสองแนวทาง แล้วสังเกตว่าแบบไหนเหมาะกับเป้าหมายและธรรมชาติของคุณมากที่สุด';

  function renderResult(){
    const r = Cosmic.score(data, S.answers);
    const tie = r.leading.length > 1;
    if(!r.leading.includes(S.tab)) S.tab = r.leading[0];
    const code = S.tab, t = data.types[code];
    const list = arr => `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    const [first, ...rest] = t.intro;

    app.innerHTML = `
      <div class="result">
        ${tie ? `
          <p class="tie-note c-lgold">${esc(TIE_TEXT)}</p>
          <div class="tabs" role="tablist" aria-label="ดวงดาวที่โดดเด่นของคุณ">
            ${r.leading.map(c=>`<button type="button" class="tab" role="tab" aria-selected="${c===code}" data-tab="${c}">${esc(data.types[c].display_name)}</button>`).join('')}
          </div>` : ''}

        <!-- 1. Flip card: front = who you are, back = quick summary (all text from JSON) -->
        <div class="flip-wrap" role="${tie?'tabpanel':'region'}" aria-label="การ์ด Cosmic Identity">
          <div class="flip-card" id="flip" data-flipped="false">
            <div class="face front tarot r-hero c-deep" aria-hidden="false">
              <span class="t-frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></span>
              <span class="t-rule" aria-hidden="true"><b>✦</b></span>
              <span class="kicker">YOUR COSMIC IDENTITY</span>
              <span class="t-orbit" aria-hidden="true">
                <i class="sp s1">✦</i><i class="sp s2">✦</i><i class="sp s3">✦</i><i class="sp s4">✦</i>
                <span class="ico ico-lg">${ICONS[code]}</span>
              </span>
              <p class="title">${esc(t.title)}</p>
              <p class="tag">${esc(t.tag)}</p>
              <span class="power">${esc(t.signature_power)}</span>
              <span class="card-score">${r.scores[code]} / ${r.total} คำตอบ</span>
              <div class="t-name">
                <h1>${esc(t.display_name)}</h1>
                <span class="symbol">${esc(t.symbol)}</span>
              </div>
            </div>
            <div class="face back tarot c-lgold" aria-hidden="true">
              <span class="t-frame" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></span>
              <span class="t-rule" aria-hidden="true"><b>✦</b></span>
              <span class="back-head">${esc(t.display_name)} · ${esc(t.symbol)}</span>
              <div class="back-block">
                <b>Your Cosmic Power</b>
                ${list(t.strength)}
              </div>
              <div class="back-block">
                <b>Trust Style</b>
                <span>${esc(t.trust_style)}</span>
              </div>
              <p class="back-quote">${esc(t.reminder)}</p>
            </div>
          </div>
          <div class="card-actions no-print">
            <button type="button" class="btn btn-line flip-btn" id="flipBtn" aria-controls="flip">↻ <span>พลิกดูด้านหลัง</span></button>
            <button type="button" class="btn btn-gold flip-btn" id="saveCard">บันทึกการ์ด (หน้า + หลัง)</button>
          </div>
        </div>

        <!-- 2. Score bars -->
        <section class="r-card c-navy" aria-label="สัดส่วนคำตอบ">
          <h2>สัดส่วนคำตอบของคุณ</h2>
          <div class="scores">
            ${Object.keys(data.types).map(c=>`
              <div class="score${r.leading.includes(c)?' lead-type':''}">
                <div class="score-top"><b>${esc(data.types[c].display_name)} · ${esc(data.types[c].symbol)}</b><span>${r.scores[c]} / ${r.total} · ${r.pct(c)}% ของคำตอบ</span></div>
                <div class="bar"><i style="width:${r.scores[c]/r.total*100}%"></i></div>
              </div>`).join('')}
          </div>
          <p class="small">ตัวเลขนี้คือสัดส่วนคำตอบจาก ${N} สถานการณ์ ไม่ใช่ความแม่นยำของบุคลิกภาพ และทุกคนมีพลังของหลายดาวร่วมกันได้</p>
        </section>

        <!-- 3. Your Star Story -->
        <section class="r-card c-off">
          <h2>Your Star Story</h2>
          <p>${esc(first)}</p>
          ${rest.length ? `<details><summary>อ่านต่อ</summary><div class="stack">${rest.map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>` : ''}
        </section>

        <!-- 4. Cosmic Power + Trust Style -->
        <div class="split">
          <section class="r-card c-lgold">
            <h2>Your Cosmic Power</h2>
            ${list(t.strength)}
          </section>
          <section class="r-card c-lgold">
            <h2>Trust Style</h2>
            <h3>${esc(t.trust_style)}</h3>
            <p>${esc(t.trust)}</p>
          </section>
        </div>

        <!-- 5. Content Universe + Shadow -->
        <section class="r-card c-navy">
          <h2>Your Content Universe</h2>
          ${list(t.content)}
          <p class="example"><b>ตัวอย่างหัวข้อ:</b> ${esc(t.example)}</p>
        </section>
        <section class="r-card c-off">
          <h2>Your Shadow</h2>
          <p>${esc(t.shadow)}</p>
          <p class="quote">${esc(t.shadowline)}</p>
        </section>

        <!-- 6. First Mission + Reminder -->
        <section class="r-card c-lgold">
          <h2>Your First Cosmic Mission</h2>
          ${list(t.missions)}
          <h3 style="margin-top:6px">Cosmic Reminder</h3>
          <p class="quote">${esc(t.reminder)}</p>
        </section>

        <!-- 7. Share / PDF / CTA -->
        <section class="r-card c-lgold no-print">
          <h2>ไปต่อจากผลของคุณ</h2>
          <div class="actions">
            <button type="button" class="btn btn-dark" id="share">แชร์ดวงดาวของฉัน</button>
            <button type="button" class="btn btn-line" id="pdf">ดาวน์โหลดผลลัพธ์ PDF</button>
            <button type="button" class="btn btn-line" id="copy">คัดลอกลิงก์แบบทดสอบ</button>
            <button type="button" class="btn btn-line" id="retake">ทำแบบประเมินใหม่</button>
          </div>
          <div class="actions" style="margin-top:6px">
            ${Cosmic.lineButton('จองคิว Personal Brand Coaching', 'btn-dark', 'cta_coaching')}
            ${Cosmic.lineButton('ดูคอร์สสร้าง Personal Brand', 'btn-line', 'cta_course')}
          </div>
        </section>

        <p class="disclaimer">${esc(data.public_disclaimer)}</p>
        <p class="slogan-line">Find Your Light. Build Your Brand.</p>
      </div>`;

    // Flip: tap the card or the button; only the visible face is read by screen readers
    const flip = document.getElementById('flip'), flipBtn = document.getElementById('flipBtn');
    const setFlip = on => {
      flip.dataset.flipped = on;
      flip.querySelector('.front').setAttribute('aria-hidden', on);
      flip.querySelector('.back').setAttribute('aria-hidden', !on);
      flipBtn.querySelector('span').textContent = on ? 'พลิกกลับด้านหน้า' : 'พลิกดูด้านหลัง';
    };
    flip.onclick = ()=>setFlip(flip.dataset.flipped !== 'true');
    flipBtn.onclick = ()=>setFlip(flip.dataset.flipped !== 'true');
    document.getElementById('saveCard').onclick = e=>saveCard(code, r, e.currentTarget);
    app.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>{ S.tab = b.dataset.tab; save(); renderResult(); Cosmic.reveal(app); });
    document.getElementById('share').onclick = ()=>{ track('share'); shareCard(code); };
    document.getElementById('pdf').onclick = ()=>{ track('pdf'); printResult(); };
    document.getElementById('copy').onclick = copyLink;
    document.getElementById('retake').onclick = ()=>{ S = fresh(); Cosmic.newSession(); go(0); };
    app.querySelectorAll('a[data-track]').forEach(a=>a.addEventListener('click', ()=>track(a.dataset.track)));
  }

  // ----- PDF: browser print → "Save as PDF" -----
  function printResult(){
    const closed = [...app.querySelectorAll('details:not([open])')];
    closed.forEach(d=>d.open = true);
    window.addEventListener('afterprint', ()=>closed.forEach(d=>d.open = false), {once:true});
    window.print();
  }

  async function copyLink(){
    const url = location.origin + location.pathname;
    track('copy_link');
    try{ await navigator.clipboard.writeText(url); Cosmic.toast('คัดลอกลิงก์แล้ว'); }
    catch(e){ window.prompt('คัดลอกลิงก์นี้', url); }
  }

  // ----- Share card 9:16 (1080×1920 PNG, no per-question answers) -----
  function wrapLines(ctx, text, maxW){
    const seg = (window.Intl && Intl.Segmenter) ? [...new Intl.Segmenter('th', {granularity:'word'}).segment(text)].map(s=>s.segment) : [...text];
    const lines = []; let line = '';
    for(const w of seg){
      const test = line + w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line.trim()); line = w.trimStart(); }
      else line = test;
    }
    if(line.trim()) lines.push(line.trim());
    return lines;
  }
  function loadSvg(markup, size, color){
    const src = markup.replace(/currentColor/g, color).replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" `);
    return new Promise((ok, bad)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = bad; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src); });
  }
  async function shareCard(code){
    const t = data.types[code];
    const NAVY = '#1A2947', DEEP = '#101A2F', GOLD = '#BE9261', LGOLD = '#DCC6A4', OFF = '#F4EFE8';
    try{ await Promise.all(['300 40px Prompt','400 40px Prompt','500 40px Prompt'].map(f=>document.fonts.load(f))); }catch(e){}
    const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0, NAVY); g.addColorStop(1, DEEP);
    x.fillStyle = g; x.fillRect(0,0,W,H);
    // stars (fixed pattern)
    for(let k=0;k<90;k++){
      const sx = (k*397)%W, sy = (k*733)%H, r = (k%3)+1.2;
      x.globalAlpha = .35 + (k%4)*.15; x.fillStyle = k%5===0 ? GOLD : LGOLD;
      x.beginPath(); x.arc(sx, sy, r, 0, Math.PI*2); x.fill();
    }
    x.globalAlpha = 1;
    // frame
    x.strokeStyle = GOLD; x.lineWidth = 3; x.beginPath(); x.roundRect ? x.roundRect(56,56,W-112,H-112,40) : x.rect(56,56,W-112,H-112); x.stroke();

    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    const text = (s, y, font, color, spacing) => { x.font = font; x.fillStyle = color; if('letterSpacing' in x) x.letterSpacing = spacing || '0px'; x.fillText(s, W/2, y); };
    text('MY COSMIC IDENTITY', 250, '500 40px Prompt', GOLD, '10px');
    // icon
    x.fillStyle = 'rgba(220,198,164,.10)'; x.beginPath(); x.arc(W/2, 560, 210, 0, Math.PI*2); x.fill();
    x.strokeStyle = 'rgba(190,146,97,.6)'; x.lineWidth = 2; x.stroke();
    try{ const im = await loadSvg(ICONS[code], 280, GOLD); x.drawImage(im, W/2-140, 420, 280, 280); }catch(e){}
    text(t.display_name, 930, '500 116px Prompt', OFF, '2px');
    text(t.symbol, 1010, '400 42px Prompt', LGOLD, '12px');
    // share line: "headline | sub"
    const [head, sub = ''] = t.share.split('|').map(s=>s.trim());
    x.font = '500 58px Prompt'; let y = 1160;
    for(const ln of wrapLines(x, head, 880)){ text(ln, y, '500 58px Prompt', OFF); y += 84; }
    y += 10; x.font = '300 42px Prompt';
    for(const ln of wrapLines(x, sub, 860)){ text(ln, y, '300 42px Prompt', LGOLD); y += 66; }
    // signature power pill
    x.font = '500 46px Prompt'; if('letterSpacing' in x) x.letterSpacing = '1px';
    const pw = x.measureText(t.signature_power).width + 100, py = Math.max(y + 60, 1480);
    x.fillStyle = GOLD; x.beginPath(); x.roundRect ? x.roundRect(W/2-pw/2, py, pw, 96, 48) : x.rect(W/2-pw/2, py, pw, 96); x.fill();
    text(t.signature_power, py + 63, '500 46px Prompt', DEEP, '1px');
    // brand
    text('Coach Mew Mastermind', 1730, '500 44px Prompt', OFF, '2px');
    text('Find Your Light. Build Your Brand.', 1792, '400 32px Prompt', GOLD, '4px');

    const blob = await new Promise(ok=>c.toBlob(ok, 'image/png'));
    const file = new File([blob], `my-cosmic-identity-${t.display_name.replace(/\s+/g,'-').toLowerCase()}.png`, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'My Cosmic Identity', text:t.share}); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    Cosmic.toast('บันทึกการ์ดแล้ว');
  }

  // ----- Save the tarot card as 2 images (front + back), drawn to match the card on screen -----
  const CW = 1080, CH = 1760;
  const PAL = {NAVY:'#1A2947', DEEP:'#101A2F', GOLD:'#BE9261', LGOLD:'#DCC6A4', OFF:'#F4EFE8'};
  function star4(x, cx, cy, s, color){
    x.fillStyle = color; x.beginPath();
    const p = [[0,-1],[.22,-.22],[1,0],[.22,.22],[0,1],[-.22,.22],[-1,0],[-.22,-.22]];
    p.forEach(([a,b],k)=>{ const px = cx + a*s, py = cy + b*s; k ? x.lineTo(px,py) : x.moveTo(px,py); });
    x.closePath(); x.fill();
  }
  function rrect(x, X, Y, w, h, r){ x.beginPath(); x.roundRect ? x.roundRect(X,Y,w,h,r) : x.rect(X,Y,w,h); }
  function tarotFrame(x, line, fill){
    rrect(x, 0, 0, CW, CH, 80); x.fillStyle = fill; x.fill();
    x.strokeStyle = line; x.lineWidth = 6; rrect(x, 18, 18, CW-36, CH-36, 66); x.stroke();
    x.globalAlpha = .85; x.lineWidth = 2.5; rrect(x, 58, 58, CW-116, CH-116, 16); x.stroke(); x.globalAlpha = 1;
    [[58,58],[CW-58,58],[58,CH-58],[CW-58,CH-58]].forEach(([a,b])=>star4(x, a, b, 22, line));
    // top rule with a star
    x.strokeStyle = line; x.lineWidth = 2.5; x.globalAlpha = .8;
    x.beginPath(); x.moveTo(120,150); x.lineTo(CW/2-46,150); x.moveTo(CW/2+46,150); x.lineTo(CW-120,150); x.stroke(); x.globalAlpha = 1;
    star4(x, CW/2, 150, 18, line);
  }
  function txt(x, s, X, Y, font, color, spacing, align){
    x.font = font; x.fillStyle = color; x.textAlign = align || 'center';
    if('letterSpacing' in x) x.letterSpacing = spacing || '0px';
    x.fillText(s, X, Y);
  }
  async function drawFront(t, code, r){
    const c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
    tarotFrame(x, PAL.GOLD, PAL.DEEP);
    const glow = x.createRadialGradient(CW/2, 0, 0, CW/2, 0, CW*.85);
    glow.addColorStop(0, 'rgba(190,146,97,.30)'); glow.addColorStop(1, 'rgba(190,146,97,0)');
    x.save(); rrect(x, 18, 18, CW-36, CH-36, 66); x.clip(); x.fillStyle = glow; x.fillRect(0,0,CW,CH);
    for(let k=0;k<70;k++){ const sx = 70 + (k*397)%(CW-140), sy = 70 + (k*733)%(CH-140);
      x.globalAlpha = .3 + (k%4)*.15; x.fillStyle = k%5===0 ? PAL.GOLD : PAL.LGOLD; x.beginPath(); x.arc(sx, sy, (k%3)+1.4, 0, Math.PI*2); x.fill(); }
    x.restore(); x.globalAlpha = 1;
    txt(x, 'YOUR COSMIC IDENTITY', CW/2, 262, '500 38px Prompt', PAL.GOLD, '12px');
    // orbit
    const oy = 580;
    x.fillStyle = PAL.GOLD;
    for(let a=0;a<360;a+=3){ const rad = a*Math.PI/180; x.globalAlpha = .8; x.beginPath(); x.arc(CW/2 + Math.cos(rad)*318, oy + Math.sin(rad)*318, 2.2, 0, Math.PI*2); x.fill(); }
    x.globalAlpha = .75; x.strokeStyle = PAL.GOLD; x.lineWidth = 2.5; x.beginPath(); x.arc(CW/2, oy, 284, 0, Math.PI*2); x.stroke();
    x.globalAlpha = .35; x.lineWidth = 2; x.beginPath(); x.arc(CW/2, oy, 232, 0, Math.PI*2); x.stroke(); x.globalAlpha = 1;
    const halo = x.createRadialGradient(CW/2, oy, 120, CW/2, oy, 210);
    halo.addColorStop(0, 'rgba(190,146,97,0)'); halo.addColorStop(.6, 'rgba(190,146,97,.28)'); halo.addColorStop(1, 'rgba(190,146,97,0)');
    x.fillStyle = halo; x.beginPath(); x.arc(CW/2, oy, 210, 0, Math.PI*2); x.fill();
    [[-210,-200,20],[250,-160,13],[-260,170,14],[190,230,20]].forEach(([dx,dy,s])=>star4(x, CW/2+dx, oy+dy, s, PAL.LGOLD));
    try{ const im = await loadSvg(ICONS[code], 300, PAL.GOLD); x.drawImage(im, CW/2-150, oy-150, 300, 300); }catch(e){}
    // words
    let y = 1000;
    x.font = '500 56px Prompt';
    for(const ln of wrapLines(x, t.title, 880)){ txt(x, ln, CW/2, y, '500 56px Prompt', PAL.OFF); y += 76; }
    y += 6; x.font = '300 40px Prompt';
    for(const ln of wrapLines(x, t.tag, 820)){ txt(x, ln, CW/2, y, '300 40px Prompt', 'rgba(244,239,232,.88)'); y += 62; }
    x.font = '500 44px Prompt'; if('letterSpacing' in x) x.letterSpacing = '1px';
    const pw = x.measureText(t.signature_power).width + 96, py = y + 14;
    x.fillStyle = PAL.GOLD; rrect(x, CW/2-pw/2, py, pw, 92, 46); x.fill();
    txt(x, t.signature_power, CW/2, py + 61, '500 44px Prompt', PAL.DEEP, '1px');
    txt(x, `${r.scores[code]} / ${r.total} คำตอบ`, CW/2, py + 160, '400 38px Prompt', PAL.LGOLD, '1px');
    // name plate
    x.strokeStyle = PAL.GOLD; x.lineWidth = 2.5; x.beginPath(); x.moveTo(110, CH-330); x.lineTo(CW-110, CH-330); x.stroke();
    let size = 112; x.font = `500 ${size}px Prompt`; if('letterSpacing' in x) x.letterSpacing = '14px';
    while(x.measureText(t.display_name.toUpperCase()).width > 820 && size > 60){ size -= 4; x.font = `500 ${size}px Prompt`; }
    txt(x, t.display_name.toUpperCase(), CW/2, CH-200, `500 ${size}px Prompt`, PAL.OFF, '14px');
    txt(x, t.symbol, CW/2, CH-128, '500 40px Prompt', PAL.GOLD, '14px');
    return c;
  }
  function drawBack(t){
    const c = document.createElement('canvas'); c.width = CW; c.height = CH; const x = c.getContext('2d');
    tarotFrame(x, PAL.NAVY, PAL.LGOLD);
    const L = 120, MAXW = CW - 2*L;
    // lay out once to measure, shrink the text if it would run past the frame
    const layout = (k, draw) => {
      let y = 250;
      const head = (s) => { if(draw) txt(x, s, L, y, `500 ${46*k}px Prompt`, PAL.DEEP, '0px', 'left'); y += 66*k; };
      const rule = () => { if(draw){ x.strokeStyle = 'rgba(16,26,47,.25)'; x.lineWidth = 2; x.beginPath(); x.moveTo(L, y); x.lineTo(CW-L, y); x.stroke(); } y += 70*k; };
      if(draw) txt(x, `${t.display_name} · ${t.symbol}`.toUpperCase(), L, y, `500 ${36*k}px Prompt`, PAL.NAVY, '8px', 'left');
      y += 60*k; rule();
      head('Your Cosmic Power');
      x.font = `400 ${38*k}px Prompt`;
      t.strength.forEach(s=>{
        wrapLines(x, s, MAXW - 50).forEach((ln, j)=>{
          if(draw){ if(!j){ x.fillStyle = PAL.DEEP; x.beginPath(); x.arc(L+12, y-13*k, 6*k, 0, Math.PI*2); x.fill(); }
            txt(x, ln, L+46, y, `400 ${38*k}px Prompt`, PAL.DEEP, '0px', 'left'); }
          y += 58*k;
        });
        y += 8*k;
      });
      y += 10*k; rule();
      head('Trust Style');
      if(draw) txt(x, t.trust_style, L, y, `400 ${40*k}px Prompt`, PAL.DEEP, '0px', 'left');
      y += 90*k;
      x.font = `400 ${38*k}px Prompt`;
      const q = wrapLines(x, t.reminder, MAXW - 50), top = y - 44*k;
      q.forEach(ln=>{ if(draw) txt(x, ln, L+40, y, `400 ${38*k}px Prompt`, PAL.DEEP, '0px', 'left'); y += 58*k; });
      if(draw){ x.fillStyle = PAL.NAVY; x.fillRect(L, top, 6, y - top - 30*k); }
      return y;
    };
    let k = 1.45;
    while(layout(k, false) > CH - 150 && k > .7) k -= .03;
    layout(k, true);
    return c;
  }
  async function saveCard(code, r, btn){
    const t = data.types[code];
    btn.disabled = true;
    try{
      try{ await Promise.all(['300 40px Prompt','400 40px Prompt','500 40px Prompt'].map(f=>document.fonts.load(f))); }catch(e){}
      const slug = t.display_name.replace(/\s+/g,'-').toLowerCase();
      const front = await drawFront(t, code, r), back = drawBack(t);
      const blobs = await Promise.all([front, back].map(cv=>new Promise(ok=>cv.toBlob(ok, 'image/png'))));
      const files = [new File([blobs[0]], `cosmic-card-${slug}-front.png`, {type:'image/png'}),
                     new File([blobs[1]], `cosmic-card-${slug}-back.png`, {type:'image/png'})];
      // phones: open the share sheet with both images (has "Save Image"); computers: download both files
      const touch = matchMedia('(pointer:coarse)').matches;
      if(touch && navigator.canShare && navigator.canShare({files})){
        try{ await navigator.share({files, title:'My Cosmic Identity'}); return; }
        catch(e){ if(e && e.name === 'AbortError') return; }
      }
      for(const f of files){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(f); a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        await new Promise(ok=>setTimeout(ok, 400));
      }
      Cosmic.toast('บันทึกการ์ดแล้ว 2 รูป (หน้า + หลัง)');
    } finally { btn.disabled = false; }
  }

  render();
})();
</script>
