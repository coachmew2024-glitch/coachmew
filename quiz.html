<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmic Identity · Coach Mew Mastermind</title>
<meta name="description" content="ทุกคนมีแสงในแบบของตัวเอง แล้วคุณล่ะ มีพลังของดวงดาวแบบไหน? 12 คำถาม ประมาณ 3–5 นาที ผลฟรีทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="Coach Mew Mastermind หน้าแรก">
      <span class="logo-mark" data-icon="logo"></span>
      <span class="logo-txt"><b>Coach Mew</b><small>MASTERMIND</small></span>
    </a>
    <ul class="menu" id="menu">
      <li><a href="index.html">หน้าแรก</a></li>
      <li><a href="index.html#coach">รู้จักครูมิว</a></li>
      <li><a href="quiz.html" aria-current="page">ค้นหาดาวของคุณ</a></li>
      <li><a href="index.html#coaching">Coaching</a></li>
      <li><a href="index.html#course">คอร์สออนไลน์</a></li>
    </ul>
    <button class="burger" id="burger" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="menu">☰</button>
  </div>
</header>

<main class="quiz-page stars">
  <div class="wrap" id="app" aria-live="polite">
    <div class="panel center-panel"><p>กำลังโหลดแบบประเมิน...</p></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span class="slogan">เพื่อนร่วมทางในการสร้างตัวตน</span>
    <span>© 2026 Coach Mew Mastermind</span>
  </div>
</footer>

<script src="cosmic.js"></script>
<script>
(async function(){
  const {esc, ICONS, store, track} = Cosmic;
  const app = document.getElementById('app');
  const KEY = 'cosmic-quiz';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let data;
  try{ data = await Cosmic.loadData(); }
  catch(err){
    console.error(err);
    app.innerHTML = '<div class="panel center-panel"><p>โหลดแบบประเมินไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</p></div>';
    return;
  }

  const Q = data.questions, N = Q.length;                      // 12
  const qIndex = Object.fromEntries(Q.map((q,i)=>[q.id,i]));
  const pad = n => String(n).padStart(2,'0');

  // Screen order: welcome → [chapter intro → its questions] ×3 → complete → result
  const SCREENS = [{k:'welcome'}];
  data.chapters.forEach((ch,ci)=>{
    SCREENS.push({k:'chapter', ci});
    ch.question_ids.forEach(id=>SCREENS.push({k:'q', i:qIndex[id], ci}));
  });
  SCREENS.push({k:'complete'}, {k:'result'});
  const screenOfQ = i => SCREENS.findIndex(s=>s.k==='q' && s.i===i);

  // State (kept in sessionStorage so a refresh continues where you were)
  const fresh = () => ({pos:0, answers:Array(N).fill(null), saved:false, tab:null});
  let S = Object.assign(fresh(), store.get(KEY) || {});
  if(!Array.isArray(S.answers) || S.answers.length !== N) S = fresh();
  // never sit past the first unanswered question
  const firstGap = S.answers.findIndex(a=>!a);
  if(firstGap !== -1 && S.pos > screenOfQ(firstGap)) S.pos = screenOfQ(firstGap);
  const save = () => store.set(KEY, S);
  const go = pos => { S.pos = pos; save(); render(); };

  function render(){
    const s = SCREENS[S.pos];
    if(s.k === 'welcome') renderWelcome();
    else if(s.k === 'chapter') renderChapter(s.ci);
    else if(s.k === 'q') renderQuestion(s.i, s.ci);
    else if(s.k === 'complete') renderComplete();
    else renderResult();
    window.scrollTo({top:0, behavior:'auto'});
    const h = app.querySelector('h1,h2');
    if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  }

  // ----- Welcome -----
  function renderWelcome(){
    track('welcome', {}, true);
    app.innerHTML = `
      <div class="panel center-panel">
        <span class="ico ico-lg">${ICONS.logo}</span>
        <span class="eyebrow">Cosmic Identity</span>
        <h1 style="font-size:clamp(24px,6vw,34px)">ทุกคนมีแสงในแบบของตัวเอง<br>แล้วคุณล่ะ มีพลังของดวงดาวแบบไหน?</h1>
        <p class="lead">ออกเดินทางผ่าน 12 สถานการณ์ในจักรวาล แล้วค้นพบว่าคุณมีแนวโน้มสื่อสารและสร้างแบรนด์ในแบบไหน</p>
        <div class="pill-row"><span>12 คำถาม</span><span>ประมาณ 3–5 นาที</span><span>ไม่มีถูกหรือผิด</span></div>
        <ul class="tips">
          <li>เลือก 1 คำตอบต่อข้อ</li>
          <li>เลือกสิ่งที่คุณ “มักทำจริง” มากกว่าสิ่งที่อยากเป็น</li>
          <li>ไม่มีคำตอบถูกหรือผิด</li>
          <li>แก้คำตอบได้ก่อนส่ง</li>
          <li>เป็นแบบประเมินเพื่อสำรวจตนเอง (Self-Reflection) ไม่ใช่การวินิจฉัย</li>
        </ul>
        <button type="button" class="btn btn-gold btn-block" id="start">เริ่มค้นหาดาวของฉัน</button>
      </div>`;
    document.getElementById('start').onclick = ()=>{ track('start'); go(1); };
  }

  // ----- Chapter intro -----
  function renderChapter(ci){
    const ch = data.chapters[ci];
    app.innerHTML = `
      <div class="chapter-wrap">
        <span class="chapter-no">CHAPTER ${ch.id}</span>
        <h1 class="chapter-name">${esc(ch.name)}</h1>
        <p class="chapter-th">${esc(ch.title_th)}</p>
        <p class="intro">${esc(ch.intro)}</p>
        <button type="button" class="btn btn-gold" id="next">ภารกิจถัดไป</button>
        <button type="button" class="link-btn" id="back" style="color:var(--brand-light-gold)">ย้อนกลับ</button>
      </div>`;
    document.getElementById('next').onclick = ()=>go(S.pos+1);
    document.getElementById('back').onclick = ()=>go(S.pos-1);
  }

  // ----- Question (1 per screen; type names never shown here) -----
  function renderQuestion(i, ci){
    const q = Q[i], ch = data.chapters[ci], picked = S.answers[i];
    app.innerHTML = `
      <div class="panel">
        <div class="q-head">
          <div class="q-meta"><b>CHAPTER ${ch.id} · ${esc(ch.name)}</b><span>ข้อ ${pad(i+1)}/${N}</span></div>
          <div class="bar" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${i+1}"><i style="width:${(i+1)/N*100}%"></i></div>
        </div>
        <p class="q-title">${esc(q.title)}</p>
        <h2 class="q-prompt" id="qp">${esc(q.prompt)}</h2>
        <fieldset class="opts" aria-labelledby="qp">
          ${q.answers.map(a=>`
            <label class="opt">
              <input type="radio" name="ans" value="${esc(a.option)}"${picked===a.option?' checked':''}>
              <span class="letter">${esc(a.option)}</span>
              <span class="txt">${esc(a.text)}</span>
            </label>`).join('')}
        </fieldset>
        <div class="q-nav">
          <button type="button" class="link-btn" id="back">ย้อนกลับ</button>
          <button type="button" class="btn btn-gold" id="next"${picked?'':' disabled'}>ภารกิจถัดไป</button>
        </div>
      </div>`;
    const next = document.getElementById('next');
    app.querySelectorAll('input[name="ans"]').forEach(r=>r.addEventListener('change', ()=>{
      S.answers[i] = r.value; S.saved = false; save(); next.disabled = false;
    }));
    next.onclick = ()=>{
      if(!S.answers[i]) return;
      track('answer', {question_no:i+1, option:S.answers[i]});
      go(S.pos+1);
    };
    document.getElementById('back').onclick = ()=>go(S.pos-1);
  }

  // ----- Completed -----
  function renderComplete(){
    track('complete', {}, true);
    app.innerHTML = `
      <div class="panel center-panel">
        <span class="ico ico-lg">${ICONS.logo}</span>
        <h1 class="done-title" style="color:var(--brand-navy)">COSMIC MISSION COMPLETED!</h1>
        <p class="lead">คุณเดินทางผ่านทั้ง 12 ภารกิจสำเร็จแล้ว ✨</p>
        <button type="button" class="btn btn-gold btn-block" id="reveal">เปิดเผย Cosmic Identity ของฉัน</button>
        <button type="button" class="link-btn" id="back">ย้อนกลับ</button>
      </div>`;
    document.getElementById('reveal').onclick = ()=>{
      const r = Cosmic.score(data, S.answers);
      if(!S.saved){ Cosmic.saveResult(S.answers, r); S.saved = true; }
      track('reveal', {}, true);
      S.tab = r.leading[0];
      go(S.pos+1);
    };
    document.getElementById('back').onclick = ()=>go(S.pos-1);
  }

  // ----- Result -----
  const TIE_TEXT = 'คุณมีพลังมากกว่าหนึ่งดวงดาวที่โดดเด่นพอ ๆ กัน นี่อาจสะท้อนว่าคุณใช้วิธีสื่อสารต่างกันตามสถานการณ์ ลองสำรวจทั้งสองแนวทาง แล้วสังเกตว่าแบบไหนเหมาะกับเป้าหมายและธรรมชาติของคุณมากที่สุด';

  function renderResult(){
    const r = Cosmic.score(data, S.answers);
    const tie = r.leading.length > 1;
    if(!r.leading.includes(S.tab)) S.tab = r.leading[0];
    const code = S.tab, t = data.types[code];
    const list = arr => `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    const [first, ...rest] = t.intro;

    app.innerHTML = `
      <div class="result">
        ${tie ? `
          <p class="tie-note">${esc(TIE_TEXT)}</p>
          <div class="tabs" role="tablist" aria-label="ดวงดาวที่โดดเด่นของคุณ">
            ${r.leading.map(c=>`<button type="button" class="tab" role="tab" aria-selected="${c===code}" data-tab="${c}">${esc(data.types[c].display_name)}</button>`).join('')}
          </div>` : ''}

        <!-- 1. Hero -->
        <div class="r-hero" role="${tie?'tabpanel':'region'}">
          <span class="ico ico-lg">${ICONS[code]}</span>
          <span class="kicker">YOUR COSMIC IDENTITY</span>
          <h1>${esc(t.display_name)}</h1>
          <span class="symbol">${esc(t.symbol)}</span>
          <p class="title">${esc(t.title)}</p>
          <p class="tag">${esc(t.tag)}</p>
        </div>

        <!-- 2. Score bars -->
        <section class="r-card" aria-label="สัดส่วนคำตอบ">
          <h2>สัดส่วนคำตอบของคุณ</h2>
          <div class="scores">
            ${Object.keys(data.types).map(c=>`
              <div class="score${r.leading.includes(c)?' lead-type':''}">
                <div class="score-top"><b>${esc(data.types[c].display_name)} · ${esc(data.types[c].symbol)}</b><span>${r.scores[c]} / ${r.total} · ${r.pct(c)}% ของคำตอบ</span></div>
                <div class="bar"><i style="width:${r.scores[c]/r.total*100}%"></i></div>
              </div>`).join('')}
          </div>
          <p class="small">ตัวเลขนี้คือสัดส่วนคำตอบจาก 12 สถานการณ์ ไม่ใช่ความแม่นยำของบุคลิกภาพ และทุกคนมีพลังของหลายดาวร่วมกันได้</p>
        </section>

        <!-- 3. Your Star Story -->
        <section class="r-card">
          <h2>Your Star Story</h2>
          <p>${esc(first)}</p>
          ${rest.length ? `<details><summary>อ่านต่อ</summary><div class="stack">${rest.map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>` : ''}
        </section>

        <!-- 4. Cosmic Power + Trust Style -->
        <div class="split">
          <section class="r-card">
            <h2>Your Cosmic Power</h2>
            ${list(t.strength)}
          </section>
          <section class="r-card">
            <h2>Trust Style</h2>
            <h3>${esc(t.trust_style)}</h3>
            <p>${esc(t.trust)}</p>
          </section>
        </div>

        <!-- 5. Content Universe + Shadow -->
        <section class="r-card">
          <h2>Your Content Universe</h2>
          ${list(t.content)}
          <p class="example"><b>ตัวอย่างหัวข้อ:</b> ${esc(t.example)}</p>
        </section>
        <section class="r-card">
          <h2>Your Shadow</h2>
          <p>${esc(t.shadow)}</p>
          <p class="quote">${esc(t.shadowline)}</p>
        </section>

        <!-- 6. First Mission + Reminder -->
        <section class="r-card">
          <h2>Your First Cosmic Mission</h2>
          ${list(t.missions)}
          <h3 style="margin-top:6px">Cosmic Reminder</h3>
          <p class="quote">${esc(t.reminder)}</p>
        </section>

        <!-- 7. Share / PDF / CTA -->
        <section class="r-card no-print">
          <h2>ไปต่อจากผลของคุณ</h2>
          <div class="actions">
            <button type="button" class="btn btn-gold" id="share">แชร์ดวงดาวของฉัน</button>
            <button type="button" class="btn btn-line" id="pdf">ดาวน์โหลดผลลัพธ์ PDF</button>
            <button type="button" class="btn btn-line" id="copy">คัดลอกลิงก์แบบทดสอบ</button>
            <button type="button" class="btn btn-line" id="retake">ทำแบบประเมินใหม่</button>
          </div>
          <div class="actions" style="margin-top:6px">
            ${Cosmic.lineButton('จองคิว Personal Brand Coaching', 'btn-gold', 'cta_coaching')}
            ${Cosmic.lineButton('ดูคอร์สสร้าง Personal Brand', 'btn-line', 'cta_course')}
          </div>
        </section>

        <p class="disclaimer">${esc(data.public_disclaimer)}</p>
        <p class="slogan-line">Find Your Light. Build Your Brand.</p>
      </div>`;

    app.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>{ S.tab = b.dataset.tab; save(); renderResult(); });
    document.getElementById('share').onclick = ()=>{ track('share'); shareCard(code); };
    document.getElementById('pdf').onclick = ()=>{ track('pdf'); printResult(); };
    document.getElementById('copy').onclick = copyLink;
    document.getElementById('retake').onclick = ()=>{ S = fresh(); Cosmic.newSession(); go(0); };
    app.querySelectorAll('a[data-track]').forEach(a=>a.addEventListener('click', ()=>track(a.dataset.track)));
  }

  // ----- PDF: browser print → "Save as PDF" -----
  function printResult(){
    const closed = [...app.querySelectorAll('details:not([open])')];
    closed.forEach(d=>d.open = true);
    window.addEventListener('afterprint', ()=>closed.forEach(d=>d.open = false), {once:true});
    window.print();
  }

  async function copyLink(){
    const url = location.origin + location.pathname;
    track('copy_link');
    try{ await navigator.clipboard.writeText(url); Cosmic.toast('คัดลอกลิงก์แล้ว'); }
    catch(e){ window.prompt('คัดลอกลิงก์นี้', url); }
  }

  // ----- Share card 9:16 (1080×1920 PNG, no per-question answers) -----
  function wrapLines(ctx, text, maxW){
    const seg = (window.Intl && Intl.Segmenter) ? [...new Intl.Segmenter('th', {granularity:'word'}).segment(text)].map(s=>s.segment) : [...text];
    const lines = []; let line = '';
    for(const w of seg){
      const test = line + w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line.trim()); line = w.trimStart(); }
      else line = test;
    }
    if(line.trim()) lines.push(line.trim());
    return lines;
  }
  function loadSvg(markup, size, color){
    const src = markup.replace(/currentColor/g, color).replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" `);
    return new Promise((ok, bad)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = bad; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src); });
  }
  async function shareCard(code){
    const t = data.types[code];
    const NAVY = '#1A2947', DEEP = '#101A2F', GOLD = '#BE9261', LGOLD = '#DCC6A4', OFF = '#F4EFE8';
    try{ await Promise.all(['300 40px Prompt','400 40px Prompt','500 40px Prompt'].map(f=>document.fonts.load(f))); }catch(e){}
    const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0, NAVY); g.addColorStop(1, DEEP);
    x.fillStyle = g; x.fillRect(0,0,W,H);
    // stars (fixed pattern)
    for(let k=0;k<90;k++){
      const sx = (k*397)%W, sy = (k*733)%H, r = (k%3)+1.2;
      x.globalAlpha = .35 + (k%4)*.15; x.fillStyle = k%5===0 ? GOLD : LGOLD;
      x.beginPath(); x.arc(sx, sy, r, 0, Math.PI*2); x.fill();
    }
    x.globalAlpha = 1;
    // frame
    x.strokeStyle = GOLD; x.lineWidth = 3; x.beginPath(); x.roundRect ? x.roundRect(56,56,W-112,H-112,40) : x.rect(56,56,W-112,H-112); x.stroke();

    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    const text = (s, y, font, color, spacing) => { x.font = font; x.fillStyle = color; if('letterSpacing' in x) x.letterSpacing = spacing || '0px'; x.fillText(s, W/2, y); };
    text('MY COSMIC IDENTITY', 250, '500 40px Prompt', GOLD, '10px');
    // icon
    x.fillStyle = 'rgba(220,198,164,.10)'; x.beginPath(); x.arc(W/2, 560, 210, 0, Math.PI*2); x.fill();
    x.strokeStyle = 'rgba(190,146,97,.6)'; x.lineWidth = 2; x.stroke();
    try{ const im = await loadSvg(ICONS[code], 280, GOLD); x.drawImage(im, W/2-140, 420, 280, 280); }catch(e){}
    text(t.display_name, 930, '500 116px Prompt', OFF, '2px');
    text(t.symbol, 1010, '400 42px Prompt', LGOLD, '12px');
    // share line: "headline | sub"
    const [head, sub = ''] = t.share.split('|').map(s=>s.trim());
    x.font = '500 58px Prompt'; let y = 1160;
    for(const ln of wrapLines(x, head, 880)){ text(ln, y, '500 58px Prompt', OFF); y += 84; }
    y += 10; x.font = '300 42px Prompt';
    for(const ln of wrapLines(x, sub, 860)){ text(ln, y, '300 42px Prompt', LGOLD); y += 66; }
    // signature power pill
    x.font = '500 46px Prompt'; if('letterSpacing' in x) x.letterSpacing = '1px';
    const pw = x.measureText(t.signature_power).width + 100, py = Math.max(y + 60, 1480);
    x.fillStyle = GOLD; x.beginPath(); x.roundRect ? x.roundRect(W/2-pw/2, py, pw, 96, 48) : x.rect(W/2-pw/2, py, pw, 96); x.fill();
    text(t.signature_power, py + 63, '500 46px Prompt', DEEP, '1px');
    // brand
    text('Coach Mew Mastermind', 1730, '500 44px Prompt', OFF, '2px');
    text('Find Your Light. Build Your Brand.', 1792, '400 32px Prompt', GOLD, '4px');

    const blob = await new Promise(ok=>c.toBlob(ok, 'image/png'));
    const file = new File([blob], `my-cosmic-identity-${t.display_name.replace(/\s+/g,'-').toLowerCase()}.png`, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'My Cosmic Identity', text:t.share}); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    Cosmic.toast('บันทึกการ์ดแล้ว');
  }

  render();
})();
</script>
</body>
</html>
